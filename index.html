<!DOCTYPE html>

<style>
:root{color-scheme:dark;--bg:#14081f;--cy:#ff9ccf;--pk:#d7b8ff;--rd:#ff3d5a;--tx:#dff6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#bg{opacity:.45;z-index:0}#cf{z-index:9}

.box{width:100%;max-width:480px;position:relative;z-index:3;text-align:center}

.k{color:#ff79c6}.v{color:#8be9fd}.o{color:#ff79c6}.s{color:#f1fa8c}.n{color:#bd93f9}.c{color:#6c7bb0;font-style:italic}.f{color:#50fa7b}.sec{color:#ff5555!important;font-weight:bold}#out b{color:#f1fa8c}

.term .h{color:#9b7fb0;font-size:11px;letter-spacing:3px;margin-bottom:6px}

.good{color:#50fa7b}.big{font-size:20px;color:#fff;font-weight:bold;transition:transform .2s}.big:hover{transform:scale(1.04)}

.by{font-family:Impact,"Arial Black",sans-serif;font-size:26px;letter-spacing:5px;color:#ffd1e8;text-shadow:0 0 18px #ff3d5a,0 0 6px #ff9ccf}

</style></head><body>
<canvas id="bg"></canvas><canvas id="cf"></canvas><button id="mute">🔊</button>
<div class="box">

<div class="win">

</div></div>
<script>
var $=function(i){return document.getElementById(i)},AC,muted=false,name="";

function lines(arr,done,sound){var d=$("code");d.innerHTML="";var i=0;(function n(){if(i>=arr.length){done&&done();return}var e=document.createElement("div");e.innerHTML=arr[i++];d.appendChild(e);if(sound)key();setTimeout(n,sound?420:0)})()}

lines(L1);

function askName(){setTimeout(function(){$("out").innerHTML="";out('<span class="good">$</span> python invite.py');out('Your name: <input id="nm" maxlength="30" autocomplete="off" placeholder="type here">');var i=$("nm");i.focus();i.addEventListener("keydown",function(e){if(e.key==="Enter"&&i.value.trim()){name=i.value.trim();ask()}})},500)}
function ask(){$("out").innerHTML="";var p=out("");p.appendChild(document.createTextNode("Hello, "+name+"! Will you be there?"));var w=document.createElement("div");w.innerHTML='<button class="b y" id="yes">YES, COUNT ME IN</button><button class="b" id="no">NO, I CAN\'T MAKE IT</button>';$("out").appendChild(w);
$("yes").onclick=function(){done(true)};$("no").onclick=function(){done(false)}}

function done(yes){$("out").innerHTML="";var a=document.createElement("a");a.target="_blank";a.rel="noopener";
if(yes){chime();confetti();var p=out("");p.className="big";p.textContent="Presence confirmed, "+name+" ✓";out("See you Friday 23 Oct, 1:00 PM, second floor hall. The rest is a surprise.");a.className="b y";a.href=wa("Presence confirmed. "+name+" will attend the Welcome Party on 23 Oct, 1:00 PM.");a.textContent="SEND CONFIRMATION ON WHATSAPP"}
else{out("No worries, "+name+". We'll miss you!");a.className="b";a.href=wa(name+" can't make it to the Welcome Party.");a.textContent="LET US KNOW ON WHATSAPP"}
$("out").appendChild(a);var s=document.createElement("div");s.className="sig";s.innerHTML='<div class="by">— BY BATCH 2K25</div>';$("out").appendChild(s)}
function confetti(){var cf=$("cf"),cc=cf.getContext("2d");cf.width=innerWidth;cf.height=innerHeight;var C=["#ffb3d1","#ff7eb6","#ff3d5a","#ff9ccf","#e8164a","#ff5c8a"],ps=[];for(var i=0;i<240;i++)ps.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*17-3,r:Math.random()*6,s:Math.random()*8+4,c:C[i%6],a:1});(function f(){cc.clearRect(0,0,cf.width,cf.height);var l=0;ps.forEach(function(p){p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.a-=.006;if(p.a>0&&p.y<cf.height+20){l++;cc.save();cc.globalAlpha=p.a;cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;cc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cc.restore()}});if(l)requestAnimationFrame(f);else cc.clearRect(0,0,cf.width,cf.height)})()}
var bg=$("bg"),bx=bg.getContext("2d"),dr=[],CH="01{}<>/;=()$#&print def if♡✦";
function rs(){bg.width=innerWidth;bg.height=innerHeight;dr=[];for(var i=0;i<Math.floor(bg.width/16);i++)dr[i]=Math.random()*-60}rs();addEventListener("resize",rs);
setInterval(function(){bx.fillStyle="rgba(20,8,31,.13)";bx.fillRect(0,0,bg.width,bg.height);bx.font="14px monospace";for(var i=0;i<dr.length;i++){bx.fillStyle=i%11===0?"#d7b8ff":"#ff9ccf";bx.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);if(dr[i]*16>bg.height&&Math.random()>.975)dr[i]=0;dr[i]++}},55);
